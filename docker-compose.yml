version: "3.9"

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ci4-php
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    depends_on:
      - mysql
    networks:
      - private

  nginx:
    image: nginx:1.27-alpine
    container_name: ci4-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - public
      - private

  mysql:
    image: mysql:8.0
    container_name: ci4-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ci4}
      MYSQL_USER: ${MYSQL_USER:-ci4}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ci4secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - private

volumes:
  db_data:

networks:
  public:
    driver: bridge
  private:
    driver: bridge
    internal: true
