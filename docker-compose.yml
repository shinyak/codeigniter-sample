version: "3.9"

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ci4-php
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - private

  nginx:
    image: nginx:1.27-alpine
    container_name: ci4-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - public
      - private

  mysql:
    image: mysql:8.0
    container_name: ci4-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ci4}
      MYSQL_USER: ${MYSQL_USER:-ci4}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ci4secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - private
      - public

  ftp:
    image: stilliard/pure-ftpd
    container_name: ci4-ftp
    environment:
      PUBLICHOST: ${FTP_PUBLICHOST:-ftp}
      FTP_USER_NAME: ${FTP_USER_NAME:-testftp}
      FTP_USER_PASS: ${FTP_USER_PASS:-testftp}
      FTP_USER_HOME: ${FTP_USER_HOME:-/home/ftpusers/testftp}
      FTP_PASSIVE_PORTS: ${FTP_PASSIVE_PORTS:-30000:30009}
    volumes:
      - ./docker/ftp/volume:/home/ftpusers
      - ./docker/ftp/passwd:/etc/pure-ftpd/passwd
    expose:
      - "21"
      - "30000-30009"
    networks:
      - private

  rustfs:
    image: rustfs/rustfs:latest
    container_name: ci4-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ${S3_BIND_ADDRESS:-0.0.0.0:9000}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ${S3_CONSOLE_BIND_ADDRESS:-0.0.0.0:9001}
    volumes:
      - ./docker/rustfs/data:/data
      - ./docker/rustfs/logs:/logs
    ports:
      - "9001:9001"
    expose:
      - "9000"
      - "9001"
    networks:
      - public
      - private

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: ci4-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_SMTP_RELAY_ENABLED: "0"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"
    networks:
      - public
      - private

volumes:
  db_data:

networks:
  public:
    driver: bridge
  private:
    driver: bridge
    internal: true
